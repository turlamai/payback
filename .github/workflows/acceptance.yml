name: Product Acceptance
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  RIVET_PIN: c1f0d921e2136c0cfb2c1c1f6d273f2b26222a19
concurrency:
  # Keep each main acceptance gate; GitHub silently replaces older pending
  # runs that share a group. Only superseded revisions of one PR cancel.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows packaged WinUI acceptance
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: Bogdanp/setup-racket@v1.16
        with: {version: '9.3', architecture: x64, distribution: full, variant: CS}
      - name: Export trusted Mozilla CA roots for Windows Racket
        shell: pwsh
        run: |
          # Some Windows runners fail reading the OS certificate store in Racket.
          # Export Node's bundled Mozilla CA roots; TLS verification stays on.
          $bundle = Join-Path $env:RUNNER_TEMP 'payback-mozilla-roots.pem'
          $js = 'const tls=require("node:tls"),fs=require("node:fs"); if(tls.rootCertificates.length<50) process.exit(2); fs.writeFileSync(process.argv[1],tls.rootCertificates.join("\n")+"\n",{flag:"wx"});'
          node -e $js $bundle
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $bundle -PathType Leaf)) {
            throw "Unable to export trusted CA roots; refusing insecure TLS fallback"
          }
          "PAYBACK_CI_CA_BUNDLE=$bundle" >> $env:GITHUB_ENV
      - name: Install pinned Rivet with verified TLS
        shell: pwsh
        run: racket scripts/ci-install-windows-deps.rkt
      - run: raco rivet acceptance --json
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: payback-acceptance-windows, path: .rivet/acceptance/, if-no-files-found: warn}
  macos:
    name: macOS packaged SwiftUI acceptance (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, arch: arm64}
          - {runner: macos-15-intel, arch: x64}
    steps:
      - uses: actions/checkout@v7
      - uses: Bogdanp/setup-racket@v1.16
        with: {version: '9.3', architecture: '${{ matrix.arch }}', distribution: full, variant: CS}
      - run: raco pkg install --auto --no-docs "https://github.com/turlamai/rivet.git#${RIVET_PIN}"
      - run: raco rivet acceptance --json
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: 'payback-acceptance-macos-${{ matrix.arch }}', path: .rivet/acceptance/, if-no-files-found: warn}
  engine-linux:
    # Issue #66: the product ships macOS + Windows (iOS companion per #63),
    # but the engine-layer acceptance suites (contract, bridge) stay
    # platform-neutral and must keep passing on Linux machines. On linux the
    # narrowed manifest applies exactly core-contract + embedded-wire — no
    # native build/package/UI leg exists.
    name: Linux engine acceptance (contract + bridge)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Bogdanp/setup-racket@v1.16
        with: {version: '9.3', architecture: x64, distribution: full, variant: CS}
      - run: raco pkg install --auto --no-docs "https://github.com/turlamai/rivet.git#${RIVET_PIN}"
      - run: raco rivet acceptance --json
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: payback-acceptance-engine-linux, path: .rivet/acceptance/, if-no-files-found: warn}
