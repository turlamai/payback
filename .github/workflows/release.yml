name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Single source of truth for the rivet pin; every install step below
# references this so a bump is one edit, not a grep-replace across jobs.
env:
  RIVET_PIN: 5b1f3466a6030592d63cec2d7f17f33ac9e1a76a
jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches VERSION / rivet.rktd / updater and CHANGELOG
        run: |
          bash scripts/check-release-version.sh "${{ github.ref_name }}"
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "^## \[${TAG}\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$TAG]' section"; exit 1; }

      - name: Verify Ed25519 release key matches the updater trust root
        env:
          UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: python3 scripts/check-update-signing-key.py

  macos:
    name: macOS package (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            racket-arch: arm64
          - arch: x64
            runner: macos-15-intel
            racket-arch: x64
    env:
      # Production signing lights up as soon as the account-level secrets
      # exist (Developer ID p12 + App Store Connect API key) and applies to
      # every workflow run that has them. Credential contract:
      # DEVELOPER_ID_P12_B64 / DEVELOPER_ID_P12_PASSWORD / ASC_KEY_ID /
      # ASC_ISSUER_ID / ASC_KEY_P8_B64; see rivet docs/production-signing.md.
      MACOS_SIGNING_CONFIGURED: ${{ secrets.DEVELOPER_ID_P12_B64 != '' && secrets.ASC_KEY_P8_B64 != '' }}
      # A tag push is a release: without credentials it must fail closed
      # instead of silently shipping ad-hoc signed artifacts.
      IS_TAG_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.16
        with:
          architecture: ${{ matrix.racket-arch }}
          version: stable
          distribution: full
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Version preflight (VERSION == rivet.rktd == updater)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Provision Developer ID certificate
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        env:
          DEVELOPER_ID_P12_B64: ${{ secrets.DEVELOPER_ID_P12_B64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          P12="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$DEVELOPER_ID_P12_B64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -s "$KEYCHAIN" $(security list-keychains | tr -d '"')
          rm -f "$P12"
          IDENTITY_NAME="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/^[^"]*"(.*)"$/\1/')"
          test -n "$IDENTITY_NAME"
          # rivet reads exactly these two (rivet docs/production-signing.md);
          # unlike `raco rivet release`, `raco rivet package` stays ad-hoc
          # until --production is passed below.
          {
            echo "RIVET_MACOS_SIGN_IDENTITY=$IDENTITY_NAME"
            echo "RIVET_MACOS_NOTARY_PROFILE=ASC_NOTARY"
          } >> "$GITHUB_ENV"
      - name: Store notarytool keychain profile
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          set -euo pipefail
          P8="$RUNNER_TEMP/asc-api-key.p8"
          printf '%s' "$ASC_KEY_P8_B64" | base64 --decode > "$P8"
          xcrun notarytool store-credentials ASC_NOTARY \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --key "$P8"
          rm -f "$P8"
      # Unlike `raco rivet release` (production by default), `raco rivet
      # package` is ad-hoc unless told otherwise: --production is the
      # explicit switch, and with the credentials exported above it
      # Developer ID-signs, notarizes, staples, and re-verifies inside
      # rivet itself (missing credentials fail closed in rivet).
      - name: Package (Developer ID + notarized)
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        run: raco rivet package --production
      - name: Package (ad-hoc dispatch smoke)
        if: env.MACOS_SIGNING_CONFIGURED != 'true' && env.IS_TAG_RELEASE != 'true'
        run: raco rivet package
      - name: Release requires signing credentials
        if: env.MACOS_SIGNING_CONFIGURED != 'true' && env.IS_TAG_RELEASE == 'true'
        run: |
          echo "::error::Tag releases must be production-signed: set the macOS signing secrets (DEVELOPER_ID_P12_B64, DEVELOPER_ID_P12_PASSWORD, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_B64) on this repository before tagging."
          exit 1
      - name: Zip + DMG (drag to Applications)
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          # ship as Payback.app regardless of how raco rivet package named it;
          # the updater's install target is /Applications/Payback.app
          mv dist/payback.app dist/Payback.app
          # portable zip: human asset, not a feed entry (the feed carries the
          # DMG — the macOS update flow mounts and copies from it)
          ( cd dist && zip -qry "../payback-${VERSION}-macos-${ARCH}.zip" Payback.app )
          brew install create-dmg
          sh scripts/make-dmg.sh dist "payback-${VERSION}-macos-${ARCH}.dmg" Payback
          # per-asset .sha256 sidecars (family benchmark)
          shasum -a 256 "payback-${VERSION}-macos-${ARCH}.zip" \
            > "payback-${VERSION}-macos-${ARCH}.zip.sha256"
          shasum -a 256 "payback-${VERSION}-macos-${ARCH}.dmg" \
            > "payback-${VERSION}-macos-${ARCH}.dmg.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: |
            payback-*-macos-*.dmg
            payback-*-macos-*.dmg.sha256
            payback-*-macos-*.zip
            payback-*-macos-*.zip.sha256
          if-no-files-found: error

  windows:
    name: Windows package (x64)
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.16
        with:
          architecture: x64
          version: stable
          distribution: full
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
        shell: bash
      - name: Install WiX (v5; v7 requires EULA acceptance, v5 runs the v4 schema)
        run: dotnet tool install --global wix --version 5.0.2
        shell: bash
      - name: Version preflight (VERSION == rivet.rktd == updater)
        shell: bash
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Package + MSI (rivet release, development signing)
        env:
          RIVET_UPDATE_BASE_URL: https://github.com/turlamai/payback/releases/download/${{ github.ref_name }}
          RIVET_UPDATE_KEY_ID: payback-2026-09
          RIVET_UPDATE_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          KEY_DER="$(mktemp -d)/update-ed25519-private.der"
          printf '%s' "$RIVET_UPDATE_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          export RIVET_UPDATE_PRIVATE_KEY="$KEY_DER"
          raco rivet release --development
          rm -f "$KEY_DER"
        shell: bash
      - name: Collect MSI + portable zip
        run: |
          # payback signs one merged feed in the publish job; the per-platform
          # channel manifest rivet emits here is not shipped.
          rm -f dist/update-*.json
          # rivet emits the MSI and the portable zip in family naming
          # already; move both to the repo root where the artifact globs
          # look, and write per-asset .sha256 sidecars (family benchmark).
          mv dist/payback-*-windows-x64.msi dist/payback-*-windows-x64.zip .
          for f in payback-*-windows-x64.msi payback-*-windows-x64.zip; do
            sha256sum "$f" > "$f.sha256"
          done
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            payback-*-windows-x64.msi
            payback-*-windows-x64.msi.sha256
            payback-*-windows-x64.zip
            payback-*-windows-x64.zip.sha256
          if-no-files-found: error

  linux:
    name: Linux package (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      # appimagetool runs in extract-and-run mode on the runner (no FUSE);
      # rivet sets this itself before invoking the tool — declared here so
      # the build machine contract is visible in the workflow (taskly form).
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Set up embeddable Racket CS
        # Literal pin: `uses:` does not expand env, so this cannot read
        # RIVET_PIN — bump it in tandem with RIVET_PIN (top of file).
        uses: turlamai/rivet/.github/actions/setup-embed-racket@5b1f3466a6030592d63cec2d7f17f33ac9e1a76a
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Install GTK toolchain + packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config file \
            desktop-file-utils rpm \
            libgtk-4-dev libjson-glib-dev libsecret-1-dev libglib2.0-dev
      - name: Version preflight (VERSION == rivet.rktd == updater)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Package (rivet release, development signing)
        env:
          RIVET_UPDATE_BASE_URL: https://github.com/turlamai/payback/releases/download/${{ github.ref_name }}
          RIVET_UPDATE_KEY_ID: payback-2026-09
          RIVET_UPDATE_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          KEY_DER="$(mktemp -d)/update-ed25519-private.der"
          printf '%s' "$RIVET_UPDATE_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          export RIVET_UPDATE_PRIVATE_KEY="$KEY_DER"
          raco rivet release --development
          rm -f "$KEY_DER"
        shell: bash
      - name: Flatpak bundle
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          case "$ARCH" in x64) FPARCH=x86_64 ;; arm64) FPARCH=aarch64 ;; esac
          sudo apt-get install --yes flatpak flatpak-builder
          # User-level everything: runner accounts install runtimes and
          # build without root. GNOME 50 is the oldest supported platform
          # runtime (48 went EOL 2026-03-24); its glibc 2.42 covers the
          # ubuntu-24.04-built payload.
          flatpak --user remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub \
            "org.gnome.Platform/${FPARCH}/50" "org.gnome.Sdk/${FPARCH}/50"
          # The manifest template carries version/arch/sha placeholders so
          # the archive source's checksum is exact per release.
          cp "dist/payback-${VERSION}-linux-${ARCH}.tar.gz" .
          SHA="$(sha256sum "payback-${VERSION}-linux-${ARCH}.tar.gz" | cut -d' ' -f1)"
          sed -e "s/__VERSION__/${VERSION}/" -e "s/__ARCH__/${ARCH}/" \
              -e "s/__SHA256__/${SHA}/" \
              flatpak/site.jrtx.payback.yml > site.jrtx.payback.gen.yml
          # --disable-rofiles-fuse: runners have no /dev/fuse.
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=flatpak-repo flatpak-build site.jrtx.payback.gen.yml
          flatpak build-bundle flatpak-repo \
            "payback-${VERSION}-linux-${ARCH}.flatpak" site.jrtx.payback stable
          rm -rf flatpak-build flatpak-repo "payback-${VERSION}-linux-${ARCH}.tar.gz"
          mv "payback-${VERSION}-linux-${ARCH}.flatpak" dist/
          test -s "dist/payback-${VERSION}-linux-${ARCH}.flatpak"
      - name: Collect artifacts + sha256 sidecars
        run: |
          set -euo pipefail
          # payback signs one merged feed in the publish job; the per-platform
          # channel manifest rivet emits here is not shipped. SBOM/notices are
          # a taskly release artifact, not a payback one — the root overview
          # lives in THIRD_PARTY_NOTICES.md at the repository root.
          rm -f dist/update-*.json dist/sbom.cdx.json dist/THIRD_PARTY_NOTICES.txt
          # Family naming audit: rivet emits these exact names — the tar.gz
          # carries the update feed's x64/arm64 arch, deb the Debian arch,
          # rpm the toolchain arch plus the build number, AppImage the
          # toolchain arch.
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          case "$ARCH" in
            x64)   DEB_ARCH=amd64;   RPM_ARCH=x86_64;  AAI_ARCH=x86_64 ;;
            arm64) DEB_ARCH=arm64;   RPM_ARCH=aarch64; AAI_ARCH=aarch64 ;;
            *) echo "unknown matrix arch: $ARCH" >&2; exit 1 ;;
          esac
          test -f "dist/payback-${VERSION}-linux-${ARCH}.tar.gz"
          test -f "dist/payback-${VERSION}-linux-${DEB_ARCH}.deb"
          # the rpm name carries the rivet.rktd build number — assert by
          # glob so a build bump needs no workflow edit
          ls dist/payback-${VERSION}-*-linux-${RPM_ARCH}.rpm >/dev/null
          test -f "dist/payback-${VERSION}-linux-${AAI_ARCH}.AppImage"
          test -f "dist/payback-${VERSION}-linux-${ARCH}.zip"
          # sha256 sidecar for every shipped artifact (rivet already writes
          # one beside the portable zip). dist also holds the staged
          # payback-linux-<arch>/ package directory — files only.
          cd dist
          for f in payback-*; do
            case "$f" in
              *.sha256) ;;
              *) [ -f "$f" ] || continue
                 [ -f "$f.sha256" ] || sha256sum "$f" > "$f.sha256" ;;
            esac
          done
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/payback-*.tar.gz
            dist/payback-*.deb
            dist/payback-*.rpm
            dist/payback-*.AppImage
            dist/payback-*.flatpak
            dist/payback-*.zip
            dist/payback-*.sha256
          if-no-files-found: error

  release:
    name: Sign manifest + publish
    needs: [macos, windows, linux]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.16
        with:
          architecture: arm64
          version: stable
          distribution: full
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Version preflight (VERSION == rivet.rktd == updater)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Flatten artifact dirs
        run: |
          find dist -mindepth 2 -maxdepth 2 -type f -exec mv {} dist/ \;
          find dist -mindepth 1 -maxdepth 1 -type d -empty -delete
          ls -la dist/
      - name: Recheck Ed25519 trust root before publishing
        env:
          UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: python3 scripts/check-update-signing-key.py
      - name: Generate + sign update manifest
        env:
          UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          KEY_DER="$(mktemp -d)/update-ed25519-private.der"
          printf '%s' "$UPDATE_ED25519_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          bash scripts/make-update-manifest.sh "${{ github.ref_name }}" dist "$KEY_DER"
          rm -f "$KEY_DER"
      - name: Audit canonical release inventory and stage public packages
        run: |
          set -euo pipefail
          VERSION="$(printf '%s' "$GITHUB_REF_NAME" | cut -c2-)"
          mkdir -p public
          for suffix in \
            macos-arm64.dmg macos-arm64.zip macos-x64.dmg macos-x64.zip \
            windows-x64.msi windows-x64.zip \
            linux-arm64.tar.gz linux-arm64.zip linux-x64.tar.gz linux-x64.zip \
            linux-amd64.deb linux-arm64.deb \
            linux-aarch64.AppImage linux-x86_64.AppImage \
            linux-x64.flatpak linux-arm64.flatpak; do
            name="payback-$VERSION-$suffix"
            test -s "dist/$name" || { echo "::error::Missing or empty $name"; exit 1; }
            cp "dist/$name" "public/$name"
          done
          for arch in aarch64 x86_64; do
            rpm="$(find dist -maxdepth 1 -type f -name "payback-$VERSION-*-linux-$arch.rpm" -print -quit)"
            test -s "$rpm" || { echo "::error::Missing $arch RPM"; exit 1; }
            cp "$rpm" public/
          done
          cp dist/update-manifest.json dist/update-stable.json public/
          test -s public/update-manifest.json && test -s public/update-stable.json
          cmp -s public/update-manifest.json public/update-stable.json
          cd public
          shasum -a 256 payback-* | LC_ALL=C sort -k2 > SHA256SUMS
          shasum -a 256 --check SHA256SUMS
          test "$(grep -c '^' SHA256SUMS)" -eq 18
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" -R turlamai/payback >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" public/* --clobber -R turlamai/payback
          else
            gh release create "$GITHUB_REF_NAME" public/* \
              -R turlamai/payback \
              --title "Payback $GITHUB_REF_NAME" \
              --generate-notes
          fi
          # Prune assets leaked by previous workflow generations on retries.
          gh release view "$GITHUB_REF_NAME" -R turlamai/payback --json assets --jq '.assets[].name' |
            while IFS= read -r name; do
              if [ ! -f "public/$name" ]; then
                gh release delete-asset "$GITHUB_REF_NAME" "$name" --yes -R turlamai/payback
              fi
            done
      - name: Attest public build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: public/*
