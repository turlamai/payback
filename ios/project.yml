name: PaybackCompanion
options:
  bundleIdPrefix: site.jrtx.payback
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
packages:
  rivet:
    # same local-package consumption as the desktop host (RIVET_ROOT):
    # payback development always runs against the local rivet checkout,
    # kept current per AGENTS.md; the companion products land upstream in
    # turlamai/rivet#486
    path: ../../rivet
targets:
  PaybackCompanion:
    type: application
    platform: iOS
    sources:
      - path: PaybackCompanion
      # shared contract files, generated / maintained by the desktop leg:
      # the typed wire models, money formatting, string tables, and the
      # generated client (regenerated by `raco rivet generate`)
      - path: ../macos-host/Sources/RivetHost/GeneratedBackend.swift
      - path: ../macos-host/Sources/RivetHost/Models.swift
      - path: ../macos-host/Sources/RivetHost/Money.swift
      - path: ../macos-host/Sources/RivetHost/L10n.swift
    dependencies:
      - package: rivet
        products:
          - RivetRuntime
          - RivetDevice
          - RivetDeviceSession
          - RivetDeviceAppleSecurity
          - RivetDeviceAppleTransport
          - RivetDeviceAppleCompanion
          - RivetDeviceAppleCompanionUI
    info:
      path: PaybackCompanion/Info.plist
      properties:
        CFBundleDisplayName: Payback
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Payback connects to your desktop on the local network to read and edit your device data.
        NSBonjourServices:
          - _rivet-device._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.jrtx.payback.companion
        MARKETING_VERSION: "1.12.0"
        CURRENT_PROJECT_VERSION: "20"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
